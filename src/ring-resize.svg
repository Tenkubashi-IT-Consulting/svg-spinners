<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" stroke="currentColor">
  <g>
    <circle cx="16" cy="16" r="14" fill="none" stroke-width="4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" dur="1.5s"
        values="0 88;25 88;25 88;25 88"
        calcMode="spline"
        keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1"
        repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" dur="1.5s"
        values="0;-88"
        calcMode="spline"
        keySplines=".42 0 .58 1"
        repeatCount="indefinite" />
    </circle>
    <animateTransform attributeName="transform" type="rotate"
      dur="2s" values="0 16 16;360 16 16"
      repeatCount="indefinite" />
  </g>
</svg>