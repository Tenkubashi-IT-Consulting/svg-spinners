<svg viewBox="0 0 32 32" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
  <g>
    <circle cx="16" cy="16" r="14" fill="none" stroke-width="4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" dur="2s"
        values="0 88;25 88;25 88;25 88"
        repeatCount="indefinite" />
      <animate attributeName="stroke-dashoffset" dur="2s"
        values="0;-88"
        repeatCount="indefinite" />
    </circle>
    <animateTransform attributeName="transform" type="rotate"
      dur="2s" values="0 16 16;360 16 16"
      repeatCount="indefinite" />
  </g>
</svg>