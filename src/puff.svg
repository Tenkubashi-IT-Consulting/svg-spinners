<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g stroke="currentColor" fill="none" stroke-width="2">
    <circle cx="16" cy="16" r="0">
      <animate attributeName="r" values="0;10" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="16" cy="16" r="0">
      <animate attributeName="r" values="0;10" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>